apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrastructure-rag
  labels:
    app: infrastructure-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infrastructure-rag
  template:
    metadata:
      labels:
        app: infrastructure-rag
    spec:
      containers:
        - name: api
          image: ghcr.io/artsiomrudenia/infrastructure-rag:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: infrastructure-rag
spec:
  selector:
    app: infrastructure-rag
  ports:
    - name: http
      port: 80
      targetPort: 8080
